name: Sofifa Scraper

on:
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (scraping)
        run: |
          cd scraping  # Entra na pasta scraping
          npm ci       # Instala as dependências

      - name: Run scraper
        run: |
          cd scraping
          npm run download-urls
          npm run full

      - name: Upload dados coletados
        uses: actions/upload-artifact@v4
        with:
          name: players-data
          path: scraping/output  # Caminho dos arquivos de saída